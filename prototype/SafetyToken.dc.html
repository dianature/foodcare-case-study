<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css"></helmet>
<sc-if value="{{ isSafe }}" hint-placeholder-val="{{ true }}">
<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 5px;border-radius:999px;background:#E9EFD5">
<span style="width:18px;height:18px;border-radius:999px;background:#7B9A2E;display:grid;place-items:center;color:#fff;font-size:11px;line-height:0"><i class="ph-bold ph-check"></i></span>
<span style="font:700 11px/1 Manrope,sans-serif;letter-spacing:.06em;color:#4F6417">SAFE</span>
</span>
</sc-if>
<sc-if value="{{ isModify }}" hint-placeholder-val="{{ false }}">
<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 5px;border-radius:999px;background:#FBF1D2">
<span style="width:18px;height:18px;border-radius:5px;background:#E8B43C;display:grid;place-items:center;color:#fff;font-size:11px;line-height:0"><i class="ph-bold ph-approximate-equals"></i></span>
<span style="font:700 11px/1 Manrope,sans-serif;letter-spacing:.06em;color:#8A6410">MODIFY</span>
</span>
</sc-if>
<sc-if value="{{ isAvoid }}" hint-placeholder-val="{{ false }}">
<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 5px;border-radius:999px;background:#F8DED7">
<span style="width:18px;height:18px;background:#E8705C;clip-path:polygon(50% 6%,100% 100%,0 100%);display:grid;place-items:center;color:#fff;font-size:8px;line-height:0;padding-top:4px;box-sizing:border-box"><i class="ph-bold ph-x"></i></span>
<span style="font:700 11px/1 Manrope,sans-serif;letter-spacing:.06em;color:#A8463A">AVOID</span>
</span>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:100,&quot;height&quot;:28},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;safe&quot;,&quot;modify&quot;,&quot;avoid&quot;],&quot;default&quot;:&quot;safe&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const s = this.props.state || 'safe';
    return { isSafe: s==='safe', isModify: s==='modify', isAvoid: s==='avoid' };
  }
}
</script>
</body>
</html>
